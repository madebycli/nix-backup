name: Check nix-backup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/backup-lib/*.sh

      - name: Evaluate flake outputs
        run: nix flake check --all-systems --show-trace

      - name: Build NixOS system
        run: nix build .#nixosConfigurations.github-vault.config.system.build.toplevel --out-link result --show-trace

      - name: Verify RTL8191SU support
        run: |
          kernel_version="$(nix eval --raw .#nixosConfigurations.github-vault.config.boot.kernelPackages.kernel.version)"
          case "$kernel_version" in
            6.6.*) ;;
            *) echo "Expected Linux 6.6, got $kernel_version" >&2; exit 1 ;;
          esac

          module_path="$(find -L result/kernel-modules -type f -name 'r8712u.ko*' -print -quit)"
          test -n "$module_path" || {
            echo "r8712u kernel module is missing from the built system" >&2
            exit 1
          }
          echo "Verified $module_path on Linux $kernel_version"
